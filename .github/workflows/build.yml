name: Build, Test and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  reuse:
    name: License metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6

  checks:
    name: Build and headless tests
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Show compiler and macOS security configuration
        run: |
          xcodebuild -version
          swift --version
          sw_vers
          /usr/bin/csrutil status
          for flag in amfi_get_out_of_my_way amfi_allow_any_signature amfi_allow_any_dyld_policy amfi; do
            if /usr/sbin/sysctl -n kern.bootargs 2>/dev/null | grep -Eq "(^|[[:space:]])${flag}=[^[:space:]]+"; then
              printf 'macOS boot argument present: %s\n' "$flag"
            fi
          done
      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            python3 Tools/release_metadata.py --tag "$RELEASE_TAG"
          else
            python3 Tools/release_metadata.py
          fi
      - name: Build and test without changing system sleep
        id: headless-tests
        run: ./test.sh --ci
      - name: Preserve the exact failed test build
        id: diagnostic-build
        if: failure() && steps.headless-tests.conclusion == 'failure' && hashFiles('build/Wakecup.app/Contents/MacOS/Wakecup') != ''
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/wakecup-diagnostic"
          mkdir -p "$directory"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/Wakecup.app "$directory/Wakecup.zip"
          (
            cd build
            /usr/bin/shasum -a 256 Wakecup.app/Contents/MacOS/Wakecup Wakecup.app/Contents/Resources/Helper/local.wakecup.helper
          ) > "$directory/SHA256SUMS.txt"
      - name: Upload failed test build
        if: failure() && steps.diagnostic-build.conclusion == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wakecup-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/wakecup-diagnostic/
          if-no-files-found: error
          retention-days: 3

  release:
    name: Signed release draft
    if: startsWith(github.ref, 'refs/tags/')
    needs: [reuse, checks]
    runs-on: macos-26
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a matching version on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 Tools/release_metadata.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build signed Apple Silicon and Intel packages
        id: packages
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_CERTIFICATE_NAME: ${{ vars.SIGNING_CERTIFICATE_NAME || 'Wakecup Release Signing' }}
          SIGNING_CERTIFICATE_SHA1: ${{ vars.SIGNING_CERTIFICATE_SHA1 || '83DEFBD5CC931816072976562C3FDF2D2CE64085' }}
        run: .github/scripts/build-signed-release.sh
      - name: Create or update a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_DIRECTORY: ${{ steps.packages.outputs.directory }}
        run: |
          set -euo pipefail
          assets=("$PACKAGE_DIRECTORY"/*.zip "$PACKAGE_DIRECTORY"/*.dmg "$PACKAGE_DIRECTORY/SHA256SUMS.txt")
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/wakecup-release.json"; then
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Refusing to replace a published release")' "$RUNNER_TEMP/wakecup-release.json"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft \
              --title "Wakecup ${RELEASE_TAG#v}" --notes-file .github/release-notes.md
          fi
